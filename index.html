<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bajaj Corporate · Overview</title>

  <!-- Fonts (design.md §9) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel (zero-build: open this file directly in a browser) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Design tokens (design.md §13) -->
  <style>
    :root{
      /* brand */
      --color-background-brand-bold-default:#005dac;--color-background-brand-bold-hovered:#004e91;--color-background-brand-bold-pressed:#003f75;
      --color-background-brand-boldest-default:#00305a;
      --color-background-brand-subtle-default:#c1dbf1;--color-background-brand-subtler-default:#e8f4ff;--color-background-brand-subtlest-default:#ffffff;
      --color-link-default:#005dac;
      /* text */
      --color-text-default:#1e293b;--color-text-subtle:#475569;--color-text-subtlest:#94a3b8;--color-text-disabled:#cbd5e1;
      --color-text-inverse:#ffffff;--color-text-brand-default:#004e91;
      --color-text-danger:#b91c1c;--color-text-warning:#b45309;--color-text-success:#4d7c0f;--color-text-information:#1d4ed8;--color-text-discovery:#4338ca;
      /* surface */
      --color-background-default:#ffffff;--color-background-disabled:#f1f5f9;
      --elevation-surface-default:#ffffff;--elevation-surface-hovered:#f8fafc;--elevation-surface-pressed:#e2e8f0;
      --color-background-neutral-subtler-default:#f8fafc;--color-background-neutral-subtle-default:#f1f5f9;
      /* border */
      --color-border-default:#e2e8f0;--color-border-bold:#cbd5e1;--color-border-brand-default:#005dac;--color-border-focus:#4d8fc8;
      /* icon */
      --color-icon-default:#1e293b;--color-icon-subtle:#475569;--color-icon-brand-default:#005dac;
      /* status backgrounds */
      --color-background-danger-default:#fef2f2;--color-background-warning-default:#fffbeb;--color-background-success-default:#f7fee7;
      --color-background-information-default:#eff6ff;--color-background-discovery-default:#eef2ff;
      /* accents (subtlest / bolder / border / text) */
      --color-accent-blue-subtlest:#eff6ff;--color-accent-blue-bolder:#2563eb;--color-accent-blue-border:#bfdbfe;--color-accent-blue-text:#1e40af;
      --color-accent-amber-subtlest:#fffbeb;--color-accent-amber-bolder:#d97706;--color-accent-amber-border:#fde68a;--color-accent-amber-text:#92400e;
      --color-accent-emerald-subtlest:#ecfdf5;--color-accent-emerald-bolder:#059669;--color-accent-emerald-border:#a7f3d0;--color-accent-emerald-text:#065f46;
      --color-accent-rose-subtlest:#fff1f2;--color-accent-rose-bolder:#e11d48;--color-accent-rose-border:#fecdd3;--color-accent-rose-text:#9f1239;
      --color-accent-indigo-subtlest:#eef2ff;--color-accent-indigo-bolder:#4f46e5;--color-accent-indigo-border:#c7d2fe;--color-accent-indigo-text:#3730a3;
    }
    html,body,#root{height:100%}
    body{margin:0;background:#f4f7fb;-webkit-font-smoothing:antialiased}
    /* calm page backdrop — keeps the brand's blue "visual treatment" but far less busy */
    .page-bg{
      background:
        radial-gradient(1200px 480px at 88% -8%, #e8f4ff 0%, rgba(232,244,255,0) 60%),
        radial-gradient(900px 420px at -6% 4%, #eef5fc 0%, rgba(238,245,252,0) 55%),
        #f4f7fb;
    }
    .no-scrollbar::-webkit-scrollbar{display:none}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  </style>

  <script>
    // Tailwind config — 1:1 transliteration of design.md §12
    tailwind.config = {
      theme:{
        extend:{
          colors:{
            brand:{
              DEFAULT:'var(--color-background-brand-bold-default)',
              hover:'var(--color-background-brand-bold-hovered)',
              pressed:'var(--color-background-brand-bold-pressed)',
              boldest:'var(--color-background-brand-boldest-default)',
              subtle:'var(--color-background-brand-subtle-default)',
              subtler:'var(--color-background-brand-subtler-default)',
            },
            fg:{
              DEFAULT:'var(--color-text-default)',subtle:'var(--color-text-subtle)',
              subtlest:'var(--color-text-subtlest)',inverse:'var(--color-text-inverse)',
              brand:'var(--color-text-brand-default)',
            },
            surface:{
              DEFAULT:'var(--elevation-surface-default)',hover:'var(--elevation-surface-hovered)',
              subtle:'var(--color-background-neutral-subtle-default)',subtler:'var(--color-background-neutral-subtler-default)',
            },
            line:{DEFAULT:'var(--color-border-default)',bold:'var(--color-border-bold)',brand:'var(--color-border-brand-default)',focus:'var(--color-border-focus)'},
            status:{danger:'var(--color-text-danger)',warning:'var(--color-text-warning)',success:'var(--color-text-success)',information:'var(--color-text-information)',discovery:'var(--color-text-discovery)'},
          },
          fontFamily:{
            title:['"Familjen Grotesk"','system-ui','sans-serif'],
            sans:['Rubik','system-ui','sans-serif'],
          },
          fontSize:{
            t1:['32px','36px'],t2:['30px','34px'],t3:['28px','32px'],
            h1:['24px','28px'],h2:['20px','24px'],h3:['16px','20px'],
            h4:['14px','20px'],h5:['12px','16px'],
            b1:['16px','24px'],b2:['14px','20px'],b3:['12px','16px'],
          },
          spacing:{'00':'0px','01':'2px','02':'4px','03':'8px','04':'12px','05':'16px','06':'20px','07':'24px','08':'32px','09':'40px','10':'48px','11':'56px','12':'64px'},
          borderRadius:{sm:'4px',md:'6px',lg:'8px',xl:'12px','2xl':'16px'},
          boxShadow:{
            xs:'0 1px 4px 0 rgba(10,13,18,0.05)',
            sm:'0 1px 2px 0 rgba(10,13,18,0.06), 0 1px 4px 0 rgba(10,13,18,0.10)',
            md:'0 2px 4px -2px rgba(10,13,18,0.06), 0 4px 8px -2px rgba(10,13,18,0.10)',
            lg:'0 4px 6px -2px rgba(10,13,18,0.03), 0 12px 16px -4px rgba(10,13,18,0.08)',
            focus:'0 0 0 4px #c1dbf1',
          },
        },
      },
    }
  </script>
</head>
<body class="font-sans text-fg">
  <div id="root">
    <div id="boot-msg" style="min-height:60vh;display:grid;place-items:center;font-family:Rubik,system-ui,sans-serif;color:#64748b">
      <div style="text-align:center">
        <div style="width:28px;height:28px;margin:0 auto 12px;border:3px solid #c1dbf1;border-top-color:#005dac;border-radius:50%;animation:spin .8s linear infinite"></div>
        Loading dashboard…
      </div>
    </div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>

  <!-- App source. Custom script type so Babel's auto-run ignores it; it is
       compiled explicitly by the boot script below (classic JSX runtime) so it
       never depends on Babel's flaky DOMContentLoaded auto-run. -->
  <script type="text/jsx-app" id="app-code">
    const { useState } = React;

    /* ----------------------------------------------------------------
       Icons — small inline set (Streamline-style, currentColor)
    ---------------------------------------------------------------- */
    const Icon = ({ d, size = 20, stroke = 1.6, fill = "none", children, ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
        strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" {...p}>
        {d ? <path d={d} /> : children}
      </svg>
    );
    const I = {
      search:(p)=><Icon {...p}><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></Icon>,
      bell:(p)=><Icon {...p} d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>,
      shield:(p)=><Icon {...p} d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>,
      refresh:(p)=><Icon {...p}><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v4h-4"/></Icon>,
      calendar:(p)=><Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></Icon>,
      heart:(p)=><Icon {...p} d="M19 14c1.5-1.5 3-3.4 3-5.5A4.5 4.5 0 0 0 12 5.5 4.5 4.5 0 0 0 2 8.5C2 13 12 21 12 21s2.5-2 5-4.5"/>,
      doc:(p)=><Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></Icon>,
      download:(p)=><Icon {...p}><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></Icon>,
      arrowUp:(p)=><Icon {...p} d="M12 19V5m0 0-6 6m6-6 6 6"/>,
      arrowDown:(p)=><Icon {...p} d="M12 5v14m0 0 6-6m-6 6-6-6"/>,
      chevron:(p)=><Icon {...p} d="m9 6 6 6-6 6"/>,
      sparkle:(p)=><Icon {...p} fill="currentColor" stroke="none"><path d="M12 2l1.8 5.5L19 9l-5.2 1.5L12 16l-1.8-5.5L5 9l5.2-1.5z"/><path d="M19 14l.9 2.6L22 18l-2.1.6L19 21l-.9-2.4L16 18l2.1-1.4z"/></Icon>,
      rocket:(p)=><Icon {...p} d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8a2 2 0 0 0-3 0M12 15l-3-3a22 22 0 0 1 8-9c2.4-.2 4.2 1.6 4 4a22 22 0 0 1-9 8M9 12H5l4-6M12 15v4l6-4"/>,
      box:(p)=><Icon {...p}><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></Icon>,
      umbrella:(p)=><Icon {...p}><path d="M12 12v7a2 2 0 0 0 4 0"/><path d="M2 12a10 10 0 0 1 20 0Z"/><path d="M12 2v2"/></Icon>,
      pin:(p)=><Icon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></Icon>,
      info:(p)=><Icon {...p}><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></Icon>,
      x:(p)=><Icon {...p} d="M6 6l12 12M18 6 6 18"/>,
    };

    /* ----------------------------------------------------------------
       Mock data
    ---------------------------------------------------------------- */
    const KPIS = [
      { key:"active",   label:"Active Policies",    value:"413",   trend:"+3.2%", up:true,  hint:"vs last quarter", icon:"shield",   accent:"blue" },
      { key:"renewals", label:"Renewals Due",       value:"32",    trend:"30 days", up:null, hint:"action needed",   icon:"refresh",  accent:"amber" },
      { key:"expiring", label:"Policies Expiring",  value:"12",    trend:"this month", up:null, hint:"review soon",   icon:"calendar", accent:"rose" },
      { key:"wellness", label:"Wellness Score",     value:"4.2", suffix:"/5", trend:"+0.3", up:true, hint:"employee avg", icon:"heart", accent:"emerald" },
    ];

    const LOBS = [
      { key:"property", label:"Property",     icon:"box" },
      { key:"marine",   label:"Marine",       icon:"umbrella" },
      { key:"liability",label:"Liability",    icon:"shield" },
      { key:"health",   label:"Group Health", icon:"heart" },
    ];

    const PORTFOLIO = {
      property:{ settlement:94, active:54, pending:20, renewals:27, expiring:32 },
      marine:{ settlement:91, active:18, pending:6, renewals:9, expiring:4 },
      liability:{ settlement:97, active:23, pending:3, renewals:7, expiring:2 },
      health:{ settlement:96, active:12, pending:11, renewals:8, expiring:5 },
    };

    const AI_PROMPTS = [
      "Which employees have pending claims?",
      "Policies expiring in the next 30 days",
      "Is our health coverage enough for the team?",
      "What new plans are available for us?",
    ];

    const NOTIFICATIONS = [
      { id:1, icon:"calendar", accent:"rose",    title:"12 policies expiring soon",      body:"Group health and marine policies expire within 30 days. Review before lapse.", time:"2h ago", unread:true },
      { id:2, icon:"refresh",  accent:"amber",   title:"Renewal quote ready",            body:"Your Property renewal quote for FY25-26 is available for approval.",          time:"5h ago", unread:true },
      { id:3, icon:"doc",      accent:"blue",    title:"Claim #CLM-4471 updated",        body:"Surveyor report uploaded. Settlement moved to processing stage.",             time:"Yesterday", unread:true },
      { id:4, icon:"shield",   accent:"emerald", title:"Endorsement approved",           body:"Liability policy endorsement for new warehouse location is now active.",     time:"2 days ago", unread:false },
      { id:5, icon:"heart",    accent:"indigo",  title:"Wellness report published",      body:"Q2 employee wellness summary is ready. Average score improved to 4.2/5.",     time:"4 days ago", unread:false },
    ];

    const ACCENT = {
      blue:{bg:"var(--color-accent-blue-subtlest)",fg:"var(--color-accent-blue-text)",bd:"var(--color-accent-blue-border)"},
      amber:{bg:"var(--color-accent-amber-subtlest)",fg:"var(--color-accent-amber-text)",bd:"var(--color-accent-amber-border)"},
      rose:{bg:"var(--color-accent-rose-subtlest)",fg:"var(--color-accent-rose-text)",bd:"var(--color-accent-rose-border)"},
      emerald:{bg:"var(--color-accent-emerald-subtlest)",fg:"var(--color-accent-emerald-text)",bd:"var(--color-accent-emerald-border)"},
      indigo:{bg:"var(--color-accent-indigo-subtlest)",fg:"var(--color-accent-indigo-text)",bd:"var(--color-accent-indigo-border)"},
    };

    /* ----------------------------------------------------------------
       Top navigation
    ---------------------------------------------------------------- */
    const NAV = ["Home","My Business","Claims","Renewals","Endorsement","Services"];

    function TopNav(){
      const [active,setActive]=useState("Home");
      const [notifOpen,setNotifOpen]=useState(false);
      return (
        <header className="sticky top-0 z-30 bg-brand text-fg-inverse shadow-sm">
          <div className="mx-auto max-w-[1280px] px-08 h-[60px] flex items-center gap-07">
            {/* co-brand lockup */}
            <div className="flex items-center gap-03 pr-05 mr-01 border-r border-white/20">
              <div className="h-[44px] w-[44px] shrink-0 rounded-lg bg-white/15 grid place-items-center font-title font-bold text-[17.6px] leading-none">L&amp;T</div>
              <div className="leading-tight">
                <div className="text-h5 text-white/70">Powered by</div>
                <div className="font-title font-semibold text-h4 -mt-[2px]">Bajaj Allianz</div>
              </div>
            </div>

            <nav className="hidden lg:flex items-center gap-01">
              {NAV.map(n=>(
                <button key={n} onClick={()=>setActive(n)}
                  className={"px-04 h-09 rounded-md text-b2 font-medium transition-colors "+
                    (active===n ? "bg-white/15 text-white" : "text-white/80 hover:bg-white/10 hover:text-white")}>
                  {n}
                </button>
              ))}
            </nav>

            <div className="ml-auto flex items-center gap-04">
              <button aria-label="Notifications" onClick={()=>setNotifOpen(true)} aria-haspopup="dialog" aria-expanded={notifOpen}
                className="relative h-09 w-09 grid place-items-center rounded-full hover:bg-white/10 focus:outline-none focus-visible:ring-2 ring-white/60">
                <I.bell size={20}/>
                <span className="absolute top-[8px] right-[8px] h-[8px] w-[8px] rounded-full bg-[#f59e0b] ring-2 ring-brand"></span>
              </button>
              <div className="flex items-center gap-03 pl-04 border-l border-white/20">
                <div className="h-09 w-09 rounded-full bg-white/15 grid place-items-center font-semibold text-b2">SA</div>
                <div className="hidden md:block leading-tight">
                  <div className="text-b2 font-semibold">Sunayana Artham</div>
                  <div className="text-h5 text-white/70">Reg. #L&amp;T-0098431</div>
                </div>
                <I.chevron size={16} className="text-white/70"/>
              </div>
            </div>
          </div>
          <NotificationPanel open={notifOpen} onClose={()=>setNotifOpen(false)}/>
        </header>
      );
    }

    /* ----------------------------------------------------------------
       Notification side panel (scrim + slide-in drawer)
    ---------------------------------------------------------------- */
    function NotificationPanel({open,onClose}){
      const unread = NOTIFICATIONS.filter(n=>n.unread).length;
      return (
        <div aria-hidden={!open} className={"fixed inset-0 z-50 "+(open?"":"pointer-events-none")}>
          {/* scrim */}
          <div onClick={onClose}
            className={"absolute inset-0 bg-black/40 transition-opacity duration-200 "+(open?"opacity-100":"opacity-0")}/>
          {/* drawer */}
          <aside role="dialog" aria-modal="true" aria-label="Notifications"
            className={"absolute top-0 right-0 h-full w-full max-w-[400px] bg-surface shadow-xl flex flex-col text-fg "+
              "transition-transform duration-300 ease-out "+(open?"translate-x-0":"translate-x-full")}>
            {/* header */}
            <div className="flex items-center gap-03 px-05 h-[60px] border-b shrink-0"
              style={{borderColor:"var(--color-border-default)"}}>
              <span className="text-fg"><I.bell size={20}/></span>
              <h2 className="font-title text-h3 font-semibold text-fg">Notifications</h2>
              {unread>0 && (
                <span className="text-h5 font-semibold px-02 h-06 min-w-[24px] grid place-items-center rounded-full"
                  style={{background:"var(--color-accent-rose-subtlest)",color:"var(--color-accent-rose-text)"}}>{unread}</span>
              )}
              <button aria-label="Close notifications" onClick={onClose}
                className="ml-auto h-08 w-08 grid place-items-center rounded-full text-fg-subtle hover:bg-black/5 hover:text-fg">
                <I.x size={18}/>
              </button>
            </div>
            {/* list */}
            <div className="flex-1 overflow-y-auto">
              {NOTIFICATIONS.map(n=>{
                const a=ACCENT[n.accent]||ACCENT.blue; const Ico=I[n.icon];
                return (
                  <div key={n.id} className="flex items-start gap-04 px-05 py-04 border-b hover:bg-black/[0.02] transition-colors"
                    style={{borderColor:"var(--color-border-subtle)"}}>
                    <span className="h-09 w-09 shrink-0 grid place-items-center rounded-full"
                      style={{background:a.bg,color:a.fg}}>{Ico && <Ico size={18}/>}</span>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-start gap-02">
                        <p className="text-b2 font-semibold text-fg flex-1">{n.title}</p>
                        {n.unread && <span className="mt-[6px] h-[8px] w-[8px] shrink-0 rounded-full" style={{background:"var(--color-accent-rose-text)"}}/>}
                      </div>
                      <p className="text-h5 text-fg-subtle mt-01 leading-snug">{n.body}</p>
                      <p className="text-h5 text-fg-subtlest mt-02">{n.time}</p>
                    </div>
                  </div>
                );
              })}
            </div>
            {/* footer */}
            <div className="px-05 py-04 border-t shrink-0" style={{borderColor:"var(--color-border-default)"}}>
              <button className="w-full h-09 rounded-lg text-b2 font-semibold text-fg-inverse bg-brand hover:opacity-90 transition-opacity">
                Mark all as read
              </button>
            </div>
          </aside>
        </div>
      );
    }

    /* ----------------------------------------------------------------
       Page header + search  (single, calm search — declutter)
    ---------------------------------------------------------------- */
    function PageHeader(){
      return (
        <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-05">
          <div>
            <h1 className="font-title text-t3 font-semibold text-fg">Hello, Sunayana 👋</h1>
            <p className="text-b1 text-fg-subtle mt-01">Here's your insurance overview for L&amp;T Corporate.</p>
          </div>
          <label className="relative w-full lg:w-[380px]">
            <span className="absolute left-04 top-1/2 -translate-y-1/2 text-fg-subtlest"><I.search size={18}/></span>
            <input
              placeholder="Search policies, claims or ID…"
              className="w-full h-10 pl-10 pr-04 rounded-lg bg-surface border border-line text-b2 text-fg placeholder:text-fg-subtlest
                         shadow-xs focus:outline-none focus:border-line-brand focus:shadow-focus transition-shadow"/>
          </label>
        </div>
      );
    }

    /* ----------------------------------------------------------------
       KPI cards
    ---------------------------------------------------------------- */
    function KpiCard({item}){
      const a=ACCENT[item.accent], Glyph=I[item.icon];
      return (
        <div className="group bg-surface rounded-xl border border-line shadow-xs hover:shadow-md transition-shadow p-05">
          <div className="flex items-start justify-between">
            <div className="h-10 w-10 rounded-lg grid place-items-center" style={{background:a.bg,color:a.fg}}>
              <Glyph size={22}/>
            </div>
            {item.up!==null ? (
              <span className="inline-flex items-center gap-01 text-h5 font-semibold rounded-full px-02 py-[2px]"
                style={{background:"var(--color-background-success-default)",color:"var(--color-text-success)"}}>
                {item.up?<I.arrowUp size={12}/>:<I.arrowDown size={12}/>}{item.trend}
              </span>
            ):(
              <span className="text-h5 font-medium text-fg-subtle rounded-full px-02 py-[2px] bg-surface-subtle">{item.trend}</span>
            )}
          </div>
          <div className="mt-04 flex items-baseline gap-01">
            <span className="font-title text-t2 font-bold text-fg leading-none">{item.value}</span>
            {item.suffix && <span className="font-title text-h2 text-fg-subtlest">{item.suffix}</span>}
          </div>
          <div className="mt-01 text-b2 font-medium text-fg-subtle">{item.label}</div>
          <div className="text-h5 text-fg-subtlest">{item.hint}</div>
        </div>
      );
    }

    /* ----------------------------------------------------------------
       Claims settlement donut
    ---------------------------------------------------------------- */
    function Donut({value}){
      const r=42, c=2*Math.PI*r, off=c*(1-value/100);
      return (
        <div className="relative h-[120px] w-[120px] shrink-0">
          <svg viewBox="0 0 110 110" className="h-full w-full -rotate-90">
            <circle cx="55" cy="55" r={r} fill="none" stroke="var(--color-background-neutral-subtle-default)" strokeWidth="11"/>
            <circle cx="55" cy="55" r={r} fill="none" stroke="var(--color-background-brand-bold-default)" strokeWidth="11"
              strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}/>
          </svg>
          <div className="absolute inset-0 grid place-items-center text-center">
            <div>
              <div className="font-title text-h1 font-bold text-fg leading-none">{value}%</div>
              <div className="text-h5 text-fg-subtlest mt-[2px]">Settled</div>
            </div>

  <!-- Deterministic boot: explicitly compile + run the app once everything is
       loaded, instead of relying on Babel's auto-run (which races CDN load
       timing and can silently leave the page blank). Surfaces errors visibly. -->
  <script>
    (function () {
      function fail(html) {
        var r = document.getElementById("root");
        if (r) r.innerHTML =
          '<div style="padding:40px;max-width:680px;margin:0 auto;font-family:Rubik,system-ui,sans-serif;color:#b91c1c">' +
          '<h2 style="margin:0 0 8px;font-size:18px">Dashboard failed to load</h2>' + html + "</div>";
      }
      function boot() {
        var root = document.getElementById("root");
        if (root && root.querySelector("header")) return; // already mounted (e.g. by auto-run)
        if (!window.React || !window.ReactDOM || !window.Babel) {
          return fail("<p>Couldn't load React/Babel from the CDN. Check your internet connection and reload the page.</p>");
        }
        try {
          var src = document.getElementById("app-code").textContent;
          var out = window.Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
          (0, eval)(out);
        } catch (e) {
          fail("<pre style=\"white-space:pre-wrap;font-size:13px\">" + (e && e.message ? e.message : e) + "</pre>");
          console.error(e);
        }
      }
      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", boot);
      } else {
        setTimeout(boot, 0);
      }
    })();
  </script>
